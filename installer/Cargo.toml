[package]
name = "signage-installer"
version = "1.3.0"
edition = "2021"
description = "Windows-installer voor Signage (zender + ontvanger)"
license = "MIT"

[[bin]]
name = "Signage-Setup"
path = "src/main.rs"

[dependencies]
include_dir = "0.7"
mslnk = "0.1"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
