[package]
name = "signage-studio-installer"
version = "0.3.0"
edition = "2021"
description = "Windows-installer voor Signage Studio (native DeckCraft-app)"
license = "Apache-2.0"
build = "build.rs"

[[bin]]
name = "Signage-Studio-Setup"
path = "src/main.rs"

[dependencies]
mslnk = "0.1"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
